<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRCL Match Control</title>
<style>
:root {
  --bg:      #0c0c10;
  --panel:   #13131a;
  --card-bg: #1a1a24;
  --border:  #2c2c3c;
  --accent:  #ff6600;
  --text:    #dde0e8;
  --dim:     #6a6a88;
  --ant:     #3a9eff;
  --plastic: #34d474;
  --beetle:  #b06aff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', Courier, monospace;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── HEADER ─────────────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 14px;
  background: var(--panel);
  border-bottom: 2px solid var(--accent);
  flex-shrink: 0;
  gap: 12px;
}
.event-title {
  font-size: 1rem;
  font-weight: bold;
  color: var(--accent);
  letter-spacing: 0.07em;
  white-space: nowrap;
}
.timer-wrap {
  display: flex;
  align-items: center;
  gap: 7px;
}
#timer {
  font-size: 2.6rem;
  font-weight: bold;
  letter-spacing: 0.05em;
  min-width: 108px;
  text-align: center;
  color: #fff;
  transition: color 0.3s;
}
#timer.warn   { color: #fbbf24; }
#timer.danger { color: #f87171; }
.tbtn {
  background: var(--card-bg);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 4px 10px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.72rem;
  letter-spacing: 0.04em;
}
.tbtn:hover { background: var(--border); }
.tbtn.active { border-color: #4ade80; color: #4ade80; }
#timer-set {
  width: 34px;
  background: var(--card-bg);
  color: var(--text);
  border: 1px solid var(--border);
  text-align: center;
  font-family: inherit;
  font-size: 0.72rem;
  padding: 4px;
}
.timer-unit { font-size: 0.72rem; color: var(--dim); }

/* ── MAIN LAYOUT ─────────────────────────────────────────────── */
main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── ROSTER ──────────────────────────────────────────────────── */
.roster {
  width: 220px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-right: 2px solid var(--border);
}
.cat {
  flex: 1;
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  min-height: 0;
}
.cat:last-child { border-bottom: none; }
.cat-head {
  padding: 5px 8px;
  font-size: 0.62rem;
  font-weight: bold;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.cat-head.full    { color: var(--ant);     background: rgba(58,158,255,0.07); }
.cat-head.plastic { color: var(--plastic); background: rgba(52,212,116,0.07); }
.cat-head.beetle  { color: var(--beetle);  background: rgba(176,106,255,0.07); }

.scroll-vp {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.scroll-track {
  position: absolute;
  width: 100%;
  top: 0;
  left: 0;
}
.scroll-vp:hover .scroll-track,
.scroll-vp.paused .scroll-track {
  animation-play-state: paused !important;
}
@keyframes scroll-up {
  from { transform: translateY(0); }
  to   { transform: translateY(-50%); }
}
.chip {
  padding: 6px 8px;
  font-size: 0.74rem;
  cursor: grab;
  border-bottom: 1px solid #1c1c26;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
  transition: background 0.1s;
}
.chip:hover  { background: #1e1e2c; }
.chip:active { cursor: grabbing; }
.chip.placed {
  color: var(--dim);
  cursor: not-allowed;
  text-decoration: line-through;
  opacity: 0.35;
}

/* ── ARENAS PANEL ────────────────────────────────────────────── */
.arenas {
  flex: 1;
  display: flex;
  overflow: hidden;
}
.arena-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--border) var(--bg);
}
.arena-col:last-child { border-right: none; }
.arena-head {
  padding: 7px 12px;
  font-size: 0.82rem;
  font-weight: bold;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  border-bottom: 2px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.arena-head.ant    { color: var(--ant);    background: rgba(58,158,255,0.05); }
.arena-head.beetle { color: var(--beetle); background: rgba(176,106,255,0.05); }
.arena-note { font-size: 0.58rem; opacity: 0.55; font-weight: normal; }

/* ── STAGE ───────────────────────────────────────────────────── */
.stage {
  display: flex;
  gap: 8px;
  padding: 10px;
  border-bottom: 2px solid var(--border);
  background: rgba(255,255,255,0.012);
  flex-shrink: 0;
}
.slot {
  flex: 1;
  border: 2px dashed var(--border);
  border-radius: 4px;
  min-height: 155px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: var(--card-bg);
  transition: border-color 0.12s, background 0.12s;
  overflow: hidden;
}
.arenas.single .slot { min-height: 300px; }
.slot.over     { border-color: #ccc; background: rgba(255,255,255,0.05); }
.slot.reject   { border-color: #f87171; background: rgba(248,113,113,0.04); }
.slot.occupied { border-style: solid; border-color: var(--border); }
.empty-lbl {
  font-size: 0.58rem;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  pointer-events: none;
}
.slot img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 4px;
  pointer-events: none;
}

/* ── QUEUES ──────────────────────────────────────────────────── */
.queues-section {
  padding: 8px;
  flex: 1;
}
.qlabel {
  font-size: 0.58rem;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 2px 2px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.queue-row {
  display: flex;
  gap: 5px;
  margin-bottom: 5px;
}
.qslot {
  flex: 1;
  border: 1px dashed var(--border);
  border-radius: 3px;
  min-height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: var(--card-bg);
  transition: border-color 0.12s, background 0.12s;
  overflow: hidden;
}
.qslot.over     { border-color: #999; background: rgba(255,255,255,0.04); }
.qslot.reject   { border-color: #f87171; }
.qslot.occupied { border-style: solid; border-color: #3a3a50; }
.qname {
  font-size: 0.72rem;
  padding: 4px 20px 4px 6px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  cursor: grab;
  width: 100%;
}
.qname:active { cursor: grabbing; }

/* ── REMOVE BUTTON ───────────────────────────────────────────── */
.xbtn {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(0,0,0,0.65);
  color: #bbb;
  border: 1px solid #444;
  cursor: pointer;
  font-size: 11px;
  line-height: 16px;
  text-align: center;
  opacity: 0;
  transition: opacity 0.12s;
  z-index: 10;
  padding: 0;
}
.slot:hover  .xbtn,
.qslot:hover .xbtn { opacity: 1; }
.xbtn:hover { background: rgba(200,50,50,0.8); color: #fff; }

/* ── ADD QUEUE BUTTON ────────────────────────────────────────── */
.add-q-btn {
  background: none;
  border: 1px dashed #303048;
  color: #404060;
  padding: 2px 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.6rem;
  border-radius: 3px;
  white-space: nowrap;
  transition: border-color 0.12s, color 0.12s;
}
.add-q-btn:hover { border-color: #6060a0; color: #8080c0; }

/* ── MATCH CONTROLS ──────────────────────────────────────────── */
.match-controls {
  display: flex;
  gap: 6px;
  padding: 6px 10px;
  border-bottom: 2px solid var(--border);
  background: rgba(255,255,255,0.012);
  flex-shrink: 0;
}
.mbtn {
  flex: 1;
  background: var(--card-bg);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.68rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.mbtn:hover { background: var(--border); }
.mbtn.primary { border-color: var(--accent); color: var(--accent); }
.mbtn.primary:hover { background: rgba(255,102,0,0.12); }

/* ── HISTORY PANEL ───────────────────────────────────────────── */
.history {
  flex-shrink: 0;
  background: var(--panel);
  border-top: 2px solid var(--accent);
  max-height: 30vh;
  display: flex;
  flex-direction: column;
}
.history.hidden { display: none; }
.history-head {
  padding: 5px 12px;
  font-size: 0.64rem;
  font-weight: bold;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
#history-list {
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) var(--bg);
}
.hist-row {
  display: flex;
  gap: 10px;
  padding: 4px 12px;
  font-size: 0.72rem;
  border-bottom: 1px solid #1c1c26;
  align-items: baseline;
}
.hist-row .hn    { color: var(--dim); min-width: 34px; }
.hist-row .harena{ min-width: 58px; text-transform: uppercase; font-size: 0.62rem; letter-spacing: 0.08em; }
.hist-row .harena.ant    { color: var(--ant); }
.hist-row .harena.beetle { color: var(--beetle); }
.hist-row .hres  { flex: 1; }
.hist-row .hres b{ color: #fff; }
.hist-row .hmeta { color: var(--dim); font-size: 0.66rem; white-space: nowrap; }
.hist-row.from-file .hn::after { content: ' ✓'; color: var(--plastic); }
.hist-empty { padding: 10px 12px; font-size: 0.68rem; color: var(--dim); }
.hist-clear {
  background: none; border: none; color: var(--dim);
  font-family: inherit; font-size: 0.58rem; cursor: pointer;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.hist-clear:hover { color: #f87171; }

/* ── RESULT MODAL ────────────────────────────────────────────── */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.modal-bg.hidden { display: none; }
.modal {
  background: var(--panel);
  border: 2px solid var(--accent);
  padding: 18px;
  width: 400px;
  max-width: 92vw;
}
.modal-title {
  color: var(--accent);
  font-weight: bold;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 0.8rem;
  margin-bottom: 4px;
}
.modal-sub { color: var(--dim); font-size: 0.7rem; margin-bottom: 12px; }
.win-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.win-btn {
  background: var(--card-bg);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 10px;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.78rem;
  text-align: left;
}
.win-btn:hover { background: var(--border); }
.win-btn.sel { border-color: #4ade80; color: #4ade80; }
.method-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.7rem; color: var(--dim);
  margin-bottom: 14px;
}
.method-row select {
  flex: 1;
  background: var(--card-bg);
  color: var(--text);
  border: 1px solid var(--border);
  font-family: inherit;
  font-size: 0.72rem;
  padding: 5px;
}
#modal-elapsed { color: var(--text); }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; }

/* ── LOAD STATUS ─────────────────────────────────────────────── */
.load-msg {
  margin: auto;
  max-width: 520px;
  padding: 20px;
  font-size: 0.78rem;
  line-height: 1.6;
  color: var(--dim);
  text-align: center;
}
.load-msg.error { color: #f87171; }
.load-msg code { color: var(--text); }
.tbtn:disabled { opacity: 0.4; cursor: not-allowed; }

/* drop zone below last queue — visible only while dragging */
.queue-drop-zone {
  height: 36px;
  border: 1px dashed transparent;
  border-radius: 3px;
  margin-top: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.58rem;
  color: transparent;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: border-color 0.12s, color 0.12s, background 0.12s;
  pointer-events: none; /* inactive until dragging */
}
body.dragging .queue-drop-zone {
  pointer-events: auto;
  border-color: #303050;
  color: #404060;
}
.queue-drop-zone.over {
  border-color: #8080c0;
  color: #9090d0;
  background: rgba(128,128,200,0.06);
}
</style>
</head>
<body>

<header>
  <div class="event-title" id="event-title">Match Control</div>
  <div class="timer-wrap">
    <div id="timer">3:00</div>
    <button class="tbtn" id="btn-start">Start</button>
    <button class="tbtn" id="btn-stop">Stop</button>
    <button class="tbtn" id="btn-reset">Reset</button>
    <input type="number" id="timer-set" value="3" min="1" max="99">
    <span class="timer-unit">min</span>
  </div>
  <div class="timer-wrap">
    <button class="tbtn" id="btn-history-toggle">History</button>
    <button class="tbtn" id="btn-export">Export TTDB</button>
  </div>
</header>

<main>
  <aside class="roster" id="roster"></aside>
  <!-- arena columns are built from the event record in events_ttdb.md -->
  <div class="arenas" id="arenas">
    <div class="load-msg" id="load-msg">Loading event…</div>
  </div>
</main>

<div id="history" class="history hidden">
  <div class="history-head">
    <span>Match History — <span id="hist-count">0</span> recorded</span>
    <button class="hist-clear" id="hist-clear">clear local</button>
  </div>
  <div id="history-list"></div>
</div>

<div id="modal" class="modal-bg hidden">
  <div class="modal">
    <div class="modal-title">Record Result</div>
    <div class="modal-sub" id="modal-vs"></div>
    <div class="win-row" id="win-row"></div>
    <div class="method-row">
      <label for="method">Method</label>
      <select id="method">
        <option value="KO">Knockout</option>
        <option value="JD">Judges' decision</option>
        <option value="TAP">Tap out</option>
        <option value="NS">No show / forfeit</option>
      </select>
      <span>Time <span id="modal-elapsed">0:00</span></span>
    </div>
    <div class="modal-btns">
      <button class="tbtn" id="modal-cancel">Cancel</button>
      <button class="tbtn" id="modal-save" disabled>Save match</button>
    </div>
  </div>
</div>

<script>
// ── EVENT + ROSTER (events_ttdb.md → cards TTDB) ────────────────────────────
// The live meet is the event record selected by events_ttdb.md's cursor, or
// meets.html?event=<event_id>. Its roster is the cards store's has_bot edges,
// filtered to the classes the event record lists (see events_ttdb.md @LAT10LON1).
const EVENTS_FILE = 'events_ttdb.md';
let EVENT = null;     // {event_id, title, timer_min, classes[], arenas[], outcome_lat, meet_record, ...}
let BASE  = '';       // directory of the cards store; card paths are relative to it
const BOTS      = {}; // class key → bots
const BOT_MAP   = {}; // bot id → {id, name, card, team, cls}
const ARENA_MAP = {}; // arena key → {key, label, classes[], note}

// Split a TTDB file into its records, keyed by coordinate ("@LAT30LON2").
function ttdbRecords(text) {
  const recs = {};
  text.split(/^(?=@LAT-?\d+LON-?\d+ \|)/m).forEach(chunk => {
    const m = chunk.match(/^@LAT-?\d+LON-?\d+/);
    if (m) recs[m[0]] = chunk;
  });
  return recs;
}

// Body lines `key: value`; `class:` and `arena:` repeat, everything else is scalar.
function parseEventRecord(body) {
  const ev = { classes: [], arenas: [] };
  body.split('\n').forEach(line => {
    const m = line.match(/^([a-z_]+):\s*(.+)$/);
    if (!m) return;
    const [, key, val] = m;
    const parts = val.split('|').map(s => s.trim());
    if (key === 'class') {
      ev.classes.push({ key: parts[0], label: parts[1] || parts[0] });
    } else if (key === 'arena') {
      ev.arenas.push({
        key:     parts[0],
        label:   parts[1] || parts[0],
        classes: (parts[2] || '').split(',').map(s => s.trim()).filter(Boolean),
        note:    parts[3] || ''
      });
    } else {
      ev[key] = val.trim();
    }
  });
  return ev;
}

function selectEvent(text) {
  const recs   = ttdbRecords(text);
  const wanted = new URLSearchParams(location.search).get('event');
  if (wanted) {
    for (const body of Object.values(recs)) {
      const ev = parseEventRecord(body);
      if (ev.event_id === wanted) return ev;
    }
    throw new Error(`No event with event_id "${wanted}" in ${EVENTS_FILE}.`);
  }
  const sel = text.match(/```cursor[\s\S]*?selected:\s*\n\s*-\s*"?(@LAT-?\d+LON-?\d+)/);
  if (!sel || !recs[sel[1]]) throw new Error(`${EVENTS_FILE} cursor does not select an event record.`);
  return parseEventRecord(recs[sel[1]]);
}

function loadRoster(cardsText) {
  const recs  = ttdbRecords(cardsText);
  const evRec = recs[EVENT.cards_event];
  if (!evRec) throw new Error(`${EVENT.cards_event} not found in ${EVENT.cards_store}.`);
  const clsByLabel = {};
  EVENT.classes.forEach(c => { clsByLabel[c.label] = c.key; BOTS[c.key] = []; });

  for (const [, coord] of evRec.matchAll(/has_bot>(@LAT-?\d+LON-?\d+)/g)) {
    const rec = recs[coord];
    if (!rec) continue;
    const field = re => (rec.match(re) || [])[1]?.trim() || '';
    const name  = field(/^## (.+)$/m);
    const card  = field(/^- Card image: !\[[^\]]*\]\(([^)]+)\)/m);
    const cls   = clsByLabel[field(/^- Weight class:\s*(.+)$/m)];
    if (!name || !card || !cls) continue; // class not running at this meet, or malformed
    let id = card.replace(/^.*\//, '').replace(/\.[^.]+$/, '').toLowerCase();
    if (BOT_MAP[id]) id += coord.replace(/\W/g, '');
    const bot = { id, name, card, team: field(/^- Team:\s*(.+)$/m), cls };
    BOTS[cls].push(bot);
    BOT_MAP[id] = bot;
  }
}

async function loadEvent() {
  const get = f => fetch(f).then(r => r.ok ? r.text() : Promise.reject(new Error(`${f}: HTTP ${r.status}`)));
  EVENT = selectEvent(await get(EVENTS_FILE));
  const missing = ['title', 'cards_store', 'cards_event', 'outcome_lat', 'meet_record'].filter(k => !EVENT[k]);
  if (!EVENT.classes.length) missing.push('class');
  if (!EVENT.arenas.length)  missing.push('arena');
  if (missing.length) {
    throw new Error(`Event record "${EVENT.event_id || '?'}" is missing: ${missing.join(', ')}.`);
  }
  EVENT.arenas.forEach(a => { ARENA_MAP[a.key] = a; });
  BASE = EVENT.cards_store.replace(/[^/]*$/, '');
  loadRoster(await get(EVENT.cards_store));
}

function arenaAccepts(arenaKey, botId) {
  const arena = ARENA_MAP[arenaKey];
  const bot   = BOT_MAP[botId];
  return !!(arena && bot && arena.classes.includes(bot.cls));
}

// ── STATE ───────────────────────────────────────────────────────────────────
const placedBots = new Set();   // ids currently in any slot
let dragBotId    = null;        // tracked during drag for dragover checks
let slotSeq      = 0;           // uid for slots

// ── TIMER ───────────────────────────────────────────────────────────────────
let timerSec   = 180;
let timerTotal = 180;
let timerTick  = null;

const timerEl   = document.getElementById('timer');
const setInput  = document.getElementById('timer-set');
const btnStart  = document.getElementById('btn-start');
const btnStop   = document.getElementById('btn-stop');
const btnReset  = document.getElementById('btn-reset');

function fmtTime(s) {
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
function renderTimer() {
  timerEl.textContent = fmtTime(timerSec);
  timerEl.className   = timerSec <= 30 ? 'danger' : timerSec <= 60 ? 'warn' : '';
}

btnStart.addEventListener('click', () => {
  if (timerTick) return;
  timerTick = setInterval(() => {
    if (timerSec > 0) { timerSec--; renderTimer(); }
    else              { clearInterval(timerTick); timerTick = null; btnStart.classList.remove('active'); }
  }, 1000);
  btnStart.classList.add('active');
});
btnStop.addEventListener('click', () => {
  clearInterval(timerTick); timerTick = null;
  btnStart.classList.remove('active');
});
btnReset.addEventListener('click', () => {
  clearInterval(timerTick); timerTick = null;
  btnStart.classList.remove('active');
  timerSec = timerTotal;
  renderTimer();
});
setInput.addEventListener('change', () => {
  const v  = Math.max(1, Math.min(99, parseInt(setInput.value) || 3));
  setInput.value = v;
  timerTotal = v * 60;
  timerSec   = timerTotal;
  renderTimer();
});

// ── ROSTER BUILD ─────────────────────────────────────────────────────────────
function buildRoster() {
  const roster = document.getElementById('roster');
  const CATS = EVENT.classes.map(c => ({ key: c.key, label: c.label, cls: c.key }));

  CATS.forEach(({ key, label, cls }) => {
    const sorted = [...BOTS[key]].sort((a, b) => a.name.localeCompare(b.name));

    const cat  = document.createElement('div');
    cat.className = 'cat';

    const head = document.createElement('div');
    head.className = `cat-head ${cls}`;
    head.textContent = label;
    cat.appendChild(head);

    const vp    = document.createElement('div');
    vp.className = 'scroll-vp';

    const track = document.createElement('div');
    track.className = 'scroll-track';

    // item height = 6+6 padding + 1.3 line-height * 0.74rem ~= 29px; use 30px
    const ITEM_H   = 30;
    const totalH   = sorted.length * ITEM_H;
    const duration = (totalH / 22).toFixed(1); // 22 px/s
    track.style.animation = `scroll-up ${duration}s linear infinite`;

    function makeChip(bot) {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = bot.name;
      if (bot.team) chip.title = bot.team;
      chip.draggable = true;
      chip.dataset.botId = bot.id;

      chip.addEventListener('dragstart', e => {
        if (placedBots.has(bot.id)) { e.preventDefault(); return; }
        dragBotId = bot.id;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', JSON.stringify({ botId: bot.id, source: 'roster' }));
        vp.classList.add('paused');
      });
      chip.addEventListener('dragend', () => {
        dragBotId = null;
        vp.classList.remove('paused');
      });
      return chip;
    }

    // original + clone for seamless loop
    sorted.forEach(b => track.appendChild(makeChip(b)));
    sorted.forEach(b => {
      const c = makeChip(b);
      c.setAttribute('aria-hidden', 'true');
      track.appendChild(c);
    });

    vp.appendChild(track);
    cat.appendChild(vp);
    roster.appendChild(cat);
  });
}

// ── CHIP PLACED STATE ────────────────────────────────────────────────────────
function setPlaced(botId, isPlaced) {
  if (isPlaced) placedBots.add(botId);
  else          placedBots.delete(botId);

  document.querySelectorAll(`.chip[data-bot-id="${botId}"]`).forEach(chip => {
    chip.classList.toggle('placed', isPlaced);
    chip.draggable = !isPlaced;
  });
}

// ── SLOT CREATION ────────────────────────────────────────────────────────────
function canDrop(slotEl, botId) {
  if (slotEl.dataset.botId) return false;                       // occupied
  return arenaAccepts(slotEl.dataset.arena, botId);
}

function clearSlot(slotEl) {
  const botId = slotEl.dataset.botId;
  if (!botId) return;
  slotEl.dataset.botId = '';
  slotEl.classList.remove('occupied');
  slotEl.querySelectorAll('img, .xbtn, .qname').forEach(el => el.remove());
  setPlaced(botId, false);

  if (slotEl.dataset.type === 'stage') {
    const lbl = document.createElement('span');
    lbl.className = 'empty-lbl';
    lbl.textContent = 'drop here';
    slotEl.appendChild(lbl);
  }
}

function placeInStage(slotEl, botId) {
  const bot = BOT_MAP[botId];
  slotEl.dataset.botId = botId;
  slotEl.classList.add('occupied');
  slotEl.querySelector('.empty-lbl')?.remove();

  const img = document.createElement('img');
  img.src = BASE + bot.card;
  img.alt = bot.name;
  slotEl.appendChild(img);

  addXBtn(slotEl);
  setPlaced(botId, true);
}

function placeInQueue(slotEl, botId) {
  const bot = BOT_MAP[botId];
  slotEl.dataset.botId = botId;
  slotEl.classList.add('occupied');

  const qname = document.createElement('div');
  qname.className = 'qname';
  qname.textContent = bot.name;
  qname.draggable = true;
  qname.dataset.botId = botId;

  qname.addEventListener('dragstart', e => {
    dragBotId = botId;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', JSON.stringify({
      botId,
      source:  'queue',
      slotId:  slotEl.dataset.slotId
    }));
  });
  qname.addEventListener('dragend', () => { dragBotId = null; });

  slotEl.appendChild(qname);
  addXBtn(slotEl);
  setPlaced(botId, true);
}

function addXBtn(parentEl) {
  const btn = document.createElement('button');
  btn.className = 'xbtn';
  btn.textContent = '\u00D7';
  btn.addEventListener('click', () => clearSlot(parentEl));
  parentEl.appendChild(btn);
}

function attachDrop(slotEl) {
  slotEl.addEventListener('dragover', e => {
    e.preventDefault();
    const ok = dragBotId && canDrop(slotEl, dragBotId);
    slotEl.classList.toggle('over',   ok);
    slotEl.classList.toggle('reject', !ok && !!dragBotId);
    e.dataTransfer.dropEffect = ok ? 'move' : 'none';
  });
  slotEl.addEventListener('dragleave', () => {
    slotEl.classList.remove('over', 'reject');
  });
  slotEl.addEventListener('drop', e => {
    e.preventDefault();
    slotEl.classList.remove('over', 'reject');
    let data;
    try { data = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
    const { botId, source, slotId } = data;
    if (!botId || !canDrop(slotEl, botId)) return;

    // Clear source queue slot (without unplacing — bot is still placed, just moving)
    if (source === 'queue' && slotId) {
      const src = document.querySelector(`[data-slot-id="${slotId}"]`);
      if (src) {
        src.dataset.botId = '';
        src.classList.remove('occupied');
        src.querySelectorAll('.qname, .xbtn').forEach(el => el.remove());
        placedBots.delete(botId); // temporarily remove so setPlaced(true) re-grays chips
      }
    }

    if (slotEl.dataset.type === 'stage') placeInStage(slotEl, botId);
    else                                 placeInQueue(slotEl, botId);
  });
}

function makeSlot(type, arena) {
  const el = document.createElement('div');
  el.className   = type === 'stage' ? 'slot' : 'qslot';
  el.dataset.slotId = `s${++slotSeq}`;
  el.dataset.arena  = arena;
  el.dataset.type   = type;
  el.dataset.botId  = '';

  if (type === 'stage') {
    const lbl = document.createElement('span');
    lbl.className = 'empty-lbl';
    lbl.textContent = 'drop here';
    el.appendChild(lbl);
  }

  attachDrop(el);
  return el;
}

// ── ARENA BUILD ──────────────────────────────────────────────────────────────
function buildArenas() {
  const arenas = document.getElementById('arenas');
  arenas.innerHTML = '';
  arenas.classList.toggle('single', EVENT.arenas.length === 1);
  EVENT.arenas.forEach(({ key, label, note }) => {
    const col = document.createElement('div');
    col.className = 'arena-col';
    col.id = `${key}-col`;
    col.innerHTML = `
      <div class="arena-head ${key}">
        <span></span>
        <span class="arena-note"></span>
      </div>
      <div class="stage" id="${key}-stage"></div>
      <div class="match-controls">
        <button class="mbtn" data-arena="${key}" data-act="next">▲ Next from queue</button>
        <button class="mbtn primary" data-arena="${key}" data-act="result">Record result</button>
      </div>
      <div class="queues-section">
        <div class="qlabel">
          <span>Queue</span>
          <button class="add-q-btn" data-arena="${key}">+ Add Queue</button>
        </div>
        <div class="queue-rows" id="${key}-queue-rows"></div>
        <div class="queue-drop-zone" id="${key}-queue-drop-zone">+ new queue</div>
      </div>`;

    nt.textContent  = note;
    arenas.appendChild(col);

}

function buildStage(arenaId, arena) {
  const stage = document.getElementById(`${arenaId}-stage`);
  stage.appendChild(makeSlot('stage', arena));
  stage.appendChild(makeSlot('stage', arena));
}

// ── QUEUE ROW BUILD ───────────────────────────────────────────────────────────
function addQueueRow(arena) {
  const container = document.getElementById(`${arena}-queue-rows`);
  const row = document.createElement('div');
  row.className = 'queue-row';
  row.appendChild(makeSlot('queue', arena));
  row.appendChild(makeSlot('queue', arena));
  container.appendChild(row);
}

function hasEmptyQueueSlot(arena) {
  return !!document.querySelector(`#${arena}-queue-rows .qslot:not(.occupied)`);
}

// Auto-expand: attach to each queue-rows container + drop zone below
function attachAutoQueue(arena) {
  const container = document.getElementById(`${arena}-queue-rows`);
  const dropZone  = document.getElementById(`${arena}-queue-drop-zone`);
  let added = false; // reset each drag

  document.addEventListener('dragstart', () => { added = false; });

  function canExpandForBot() {
    return !!dragBotId && arenaAccepts(arena, dragBotId);
  }

  // Auto-expand when hovering over full queue rows
  container.addEventListener('dragover', e => {
    e.preventDefault();
    if (!canExpandForBot() || added) return;
    if (!hasEmptyQueueSlot(arena)) {
      addQueueRow(arena);
      added = true;
    }
  });

  // Drop zone below last queue
  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    if (!canExpandForBot()) return;
    dropZone.classList.add('over');
    e.dataTransfer.dropEffect = 'move';
  });
  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('over');
  });
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('over');
    if (!canExpandForBot()) return;
    let data;
    try { data = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
    const { botId, source, slotId } = data;
    if (!botId) return;
    addQueueRow(arena);
    added = true;
    // Place into the first empty slot of the new row
    const newSlot = document.querySelector(`#${arena}-queue-rows .qslot:not(.occupied)`);
    if (!newSlot) return;
    if (source === 'queue' && slotId) {
      const src = document.querySelector(`[data-slot-id="${slotId}"]`);
      if (src) {
        src.dataset.botId = '';
        src.classList.remove('occupied');
        src.querySelectorAll('.qname, .xbtn').forEach(el => el.remove());
        placedBots.delete(botId);
      }
    }
    placeInQueue(newSlot, botId);
  });
}

// Toggle body.dragging so drop zones become interactive
document.addEventListener('dragstart', () => document.body.classList.add('dragging'));
document.addEventListener('dragend',   () => document.body.classList.remove('dragging'));

// ── MATCH LOG (agent memory: meet_ttdb.md, the event's outcome lane) ────────
// Contract per meet_ttdb.md @LAT10LON2: page fetches the store on load, merges
// the event's outcome-lane records with localStorage (file wins, dedupe by
// match number), and Export TTDB downloads the store with missing outcome
// records appended. The lane comes from the event record's outcome_lat.
const TTDB_FILE  = 'meet_ttdb.md';
let OUTCOME_LAT  = null; // set from EVENT.outcome_lat at init
let LS_KEY       = null; // per lane, so meets never share a local log
const METHOD_LABEL = { KO: 'KO', JD: 'JD', TAP: 'tap out', NS: 'no show' };

let matchLog = [];   // {n, ts, arena, cls, red, blue, result, method, elapsed, fromFile}
let ttdbBase = null; // fetched store text, base for export

function loadLocalLog() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch { return []; }
}
function saveLocalLog() {
  if (!LS_KEY) return; // event not loaded yet
  localStorage.setItem(LS_KEY, JSON.stringify(matchLog.filter(m => !m.fromFile)));
}

// Tolerant parser: pull every @LAT<lane>LONn record's key/value body lines.
// Malformed records are skipped, never fatal (store rule: parser never crashes).
function parseOutcomeRecords(text) {
  const out = [];
  const re = new RegExp(`^@LAT${OUTCOME_LAT}LON(\\d+) \\| created:(\\d+)`, 'gm');
  let m;
  while ((m = re.exec(text)) !== null) {
    const end  = text.indexOf('\n@LAT', m.index + 1);
    const body = text.slice(m.index, end === -1 ? text.length : end);
    const field = k => {
      const f = body.match(new RegExp(`^${k}:\\s*(.+)$`, 'm'));
      return f ? f[1].trim() : '';
    };
    const rec = {
      n:       parseInt(m[1], 10),
      ts:      parseInt(m[2], 10),
      arena:   field('arena'),
      cls:     field('class'),
      red:     field('red'),
      blue:    field('blue'),
      result:  field('result'),
      method:  field('method'),
      elapsed: field('elapsed'),
      fromFile: true
    };
    if (rec.red && rec.blue && rec.result) out.push(rec);
  }
  return out;
}

function mergeLogs(fileRecs, localRecs) {
  const byN = new Map();
  localRecs.forEach(r => byN.set(r.n, r));
  fileRecs.forEach(r => byN.set(r.n, r)); // file wins
  return [...byN.values()].sort((a, b) => a.n - b.n);
}

function outcomeToTTDB(m) {
  const bot = id => BOT_MAP[id]?.name || id;
  const title = m.result === 'draw'
    ? `${bot(m.red)} vs ${bot(m.blue)} — draw`
    : `${bot(m.result === 'red' ? m.red : m.blue)} def. ${bot(m.result === 'red' ? m.blue : m.red)}`;
  return `@LAT${OUTCOME_LAT}LON${m.n} | created:${m.ts} | updated:${m.ts} | relates:derived_from${EVENT.meet_record}
[ew]
conf:240
rev:0
sal:100
touched:${m.ts}
[/ew]

**MATCH ${m.n} — ${title} (${m.arena} arena)**
src: meets.html match control

arena: ${m.arena}
class: ${m.cls}
red: ${m.red}
blue: ${m.blue}
result: ${m.result}
method: ${m.method}
elapsed: ${m.elapsed}
recorded_by: meets.html ${EVENT.title}`;
}

// ── HISTORY PANEL ────────────────────────────────────────────────────────────
const historyPanel = document.getElementById('history');
const historyList  = document.getElementById('history-list');
const histCount    = document.getElementById('hist-count');

function renderHistory() {
  historyList.innerHTML = '';
  histCount.textContent = matchLog.length;
  if (!matchLog.length) {
    const d = document.createElement('div');
    d.className = 'hist-empty';
    d.textContent = 'No matches recorded yet. Stage two bots, run the timer, then Record Result.';
    historyList.appendChild(d);
    return;
  }
  const bot = id => BOT_MAP[id]?.name || id;
  [...matchLog].reverse().forEach(m => {
    const row = document.createElement('div');
    row.className = 'hist-row' + (m.fromFile ? ' from-file' : '');
    const res = m.result === 'draw'
      ? `${bot(m.red)} vs ${bot(m.blue)} — <b>draw</b>`
      : `<b>${bot(m.result === 'red' ? m.red : m.blue)}</b> def. ${bot(m.result === 'red' ? m.blue : m.red)}`;
    row.innerHTML =
      `<span class="hn">#${m.n}</span>` +
      `<span class="harena ${m.arena}">${m.arena}</span>` +
      `<span class="hres">${res}</span>` +
      `<span class="hmeta">${METHOD_LABEL[m.method] || m.method} · ${m.elapsed}</span>`;
    historyList.appendChild(row);
  });
}

document.getElementById('btn-history-toggle').addEventListener('click', () => {
  historyPanel.classList.toggle('hidden');
});
document.getElementById('hist-clear').addEventListener('click', () => {
  if (!confirm('Clear locally recorded matches? Records already in meet_ttdb.md are kept.')) return;
  matchLog = matchLog.filter(m => m.fromFile);
  saveLocalLog();
  renderHistory();
});

// ── MATCH FLOW ───────────────────────────────────────────────────────────────
function stageSlots(arena) {
  return [...document.querySelectorAll(`#${arena}-stage .slot`)];
}

function nextFromQueue(arena) {
  const slots = stageSlots(arena).filter(s => !s.dataset.botId);
  if (!slots.length) return;
  const qslots = [...document.querySelectorAll(`#${arena}-queue-rows .qslot.occupied`)];
  slots.forEach(slot => {
    const q = qslots.shift();
    if (!q) return;
    const botId = q.dataset.botId;
    q.dataset.botId = '';
    q.classList.remove('occupied');
    q.querySelectorAll('.qname, .xbtn').forEach(el => el.remove());
    placedBots.delete(botId); // moving, not unplacing
    placeInStage(slot, botId);
  });
}

// result modal state
let pendingMatch = null; // {arena, red, blue}
let pendingResult = null;
const modal        = document.getElementById('modal');
const modalVs      = document.getElementById('modal-vs');
const winRow       = document.getElementById('win-row');
const methodSel    = document.getElementById('method');
const modalElapsed = document.getElementById('modal-elapsed');
const modalSave    = document.getElementById('modal-save');

function openResultModal(arena) {
  const [a, b] = stageSlots(arena).map(s => s.dataset.botId);
  if (!a || !b) { alert('Stage two bots in this arena first.'); return; }
  pendingMatch  = { arena, red: a, blue: b };
  pendingResult = null;
  modalSave.disabled = true;
  modalVs.textContent = `${BOT_MAP[a].name} vs ${BOT_MAP[b].name} — ${arena} arena`;
  modalElapsed.textContent = fmtTime(timerTotal - timerSec);
  winRow.innerHTML = '';
  [['red', `Winner: ${BOT_MAP[a].name}`], ['blue', `Winner: ${BOT_MAP[b].name}`], ['draw', 'Draw']]
    .forEach(([val, label]) => {
      const btn = document.createElement('button');
      btn.className = 'win-btn';
      btn.textContent = label;
      btn.addEventListener('click', () => {
        pendingResult = val;
        winRow.querySelectorAll('.win-btn').forEach(x => x.classList.remove('sel'));
        btn.classList.add('sel');
        modalSave.disabled = false;
      });
      winRow.appendChild(btn);
    });
  modal.classList.remove('hidden');
}

document.getElementById('modal-cancel').addEventListener('click', () => {
  modal.classList.add('hidden');
  pendingMatch = null;
});

modalSave.addEventListener('click', () => {
  if (!pendingMatch || !pendingResult) return;
  const { arena, red, blue } = pendingMatch;
  const redCls  = BOT_MAP[red].cls;
  const blueCls = BOT_MAP[blue].cls;
  const nextN = matchLog.reduce((mx, m) => Math.max(mx, m.n), 0) + 1;
  matchLog.push({
    n: nextN,
    ts: Math.floor(Date.now() / 1000),
    arena,
    cls: redCls === blueCls ? redCls : 'mixed',
    red, blue,
    result: pendingResult,
    method: methodSel.value,
    elapsed: fmtTime(timerTotal - timerSec),
    fromFile: false
  });
  saveLocalLog();
  renderHistory();
  historyPanel.classList.remove('hidden');
  modal.classList.add('hidden');
  pendingMatch = null;

  // stop + reset timer, clear the stage, pull the next pair from the queue
  clearInterval(timerTick); timerTick = null;
  btnStart.classList.remove('active');
  timerSec = timerTotal;
  renderTimer();
  stageSlots(arena).forEach(clearSlot);
  nextFromQueue(arena);
});

// ── TTDB LOAD + EXPORT ───────────────────────────────────────────────────────
function initMatchLog() {
  matchLog = mergeLogs([], loadLocalLog());
  renderHistory();
  fetch(TTDB_FILE)
    .then(r => r.ok ? r.text() : Promise.reject(r.status))
    .then(text => {
      ttdbBase = text;
      matchLog = mergeLogs(parseOutcomeRecords(text), loadLocalLog());
      renderHistory();
    })
    .catch(() => { /* file:// or missing store — localStorage only */ });
}

document.getElementById('btn-export').addEventListener('click', () => {
  if (!EVENT) return;
  let base = ttdbBase;
  if (base === null) {
    alert('meet_ttdb.md could not be loaded (serve the site over http to export the full store). Exporting outcome records only.');
    base = '# IRCL meet outcome records (partial export — merge into meet_ttdb.md)\n';
  }
  let out = base.replace(/\s+$/, '');
  const fresh = matchLog.filter(m => !new RegExp(`^@LAT${OUTCOME_LAT}LON${m.n} `, 'm').test(base));
  fresh.forEach(m => { out += '\n\n---\n\n' + outcomeToTTDB(m); });
  out += '\n';
  const blob = new Blob([out], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = TTDB_FILE;
  a.click();
  URL.revokeObjectURL(a.href);
});

// ── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  document.title = `${EVENT.title} – Match Control`;
  document.getElementById('event-title').textContent = EVENT.title;

  const mins = Math.max(1, Math.min(99, parseInt(EVENT.timer_min, 10) || 3));
  setInput.value = mins;
  timerTotal = timerSec = mins * 60;

  OUTCOME_LAT = parseInt(EVENT.outcome_lat, 10);
  LS_KEY      = `ircl_meet_lat${OUTCOME_LAT}_log`;

  buildRoster();
  buildArenas();
  EVENT.arenas.forEach(({ key }) => {
    buildStage(key, key);
    addQueueRow(key);
    attachAutoQueue(key);
  });

  document.querySelectorAll('.add-q-btn').forEach(btn => {
    btn.addEventListener('click', () => addQueueRow(btn.dataset.arena));
  });
  document.querySelectorAll('.mbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.act === 'next') nextFromQueue(btn.dataset.arena);
      else                            openResultModal(btn.dataset.arena);
    });
  });

  renderTimer();
  initMatchLog();
}

function showLoadError(err) {
  const msg = document.getElementById('load-msg');
  msg.classList.add('error');
  msg.textContent = `Could not load the event: ${err.message}`;
  if (location.protocol === 'file:') {
    const hint = document.createElement('div');
    hint.innerHTML = '<br>This page reads <code>events_ttdb.md</code> and the cards store over http. ' +
      'Run <code>python service.py</code> and open <code>http://127.0.0.1:8000/meets.html</code>.';
    msg.appendChild(hint);
  }
}

renderTimer();
loadEvent().then(init, showLoadError);
